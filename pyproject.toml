[tool.black]
line-length = 88
extend-exclude = '(venv|\.venv|htmlcov)/'

[tool.isort]
profile = "black"
skip = ["venv", ".venv", "htmlcov"]
extend_skip_glob = [".claude/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["venv/*", ".venv/*", "tests/*"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = '^(venv|\.venv|htmlcov)/'
